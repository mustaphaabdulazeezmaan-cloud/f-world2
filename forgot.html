<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Forgot Password</title>
        <style>
            * {
                box-sizing: border-box;
            }

            body {
                margin: 0;
                background-color: #080836;
            }

            .con {
                width: 80%;
                margin: 5% 10% 0% 10%;
                background-color: #ffffff;
                border-radius: 15px;
                display: flex;
                overflow: hidden;
                box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            }

            #ls{
                width: 55%;
                padding: 100px 60px 50px 60px;
            }
            #rs{
                width: 45%;
            }

            #f-world {
                color: #1c84a9;
                font-size: 48px;
                font-weight: bold;
                font-style: italic;
                display: block;
                text-align: center;
                margin-bottom: 15px;
            }

            #re{
                font-size: 25px;
                line-height: 50px;
            }
            .enter {
                width: 100%;
                padding: 14px;
                border-radius: 25px;
                border: 2px solid #aaaaaa;
                margin-bottom: 15px;
                font-size: 16px;
            }
            button {
                background-color: #1c84a9;
                color: white;
                padding: 12px;
                border: none;
                border-radius: 25px;
                width: 100%;
                font-size: 16px;
                font-weight: bold;
                cursor: pointer;
                margin-top: 15px;
                transition: background-color 0.3s ease;
            }

            button:hover {
                background-color: #22aaaa;
            }
            form p{
                text-align: center;
                color: #666666;
            }
            form p a{
                text-decoration: none;
                color: #666666;
            }
            form p a:hover{
                color: #1c84a9;
            }

            @media screen and (max-width: 768px) {
                .con {
                    flex-direction: column;
                    margin-top: 30%;
                }
                #ls {
                    width: 100%;
                    padding: 40px 20px;
                }

                #f-world {
                    font-size: 36px;
                }
                #re{
                    font-size: 20px;
                }
                rs {
                    display: none;
                }
            }

            @media screen and (max-width: 480px) {
                #f-world {
                    font-size: 30px;
                }
                #re{
                    font-size: 20px;
                }
                .enter {
                    font-size: 14px;
                    padding: 12px;
                }
                button {
                    font-size: 15px;
                    padding: 12px;
                }
                #rs {
                    display: none;
                }
            }
        </style>
    </head>
    <body>
        <div class="con">
            <div id="ls">
                <span id="f-world">F-WORLD</span>
                <span id="re">Enter Your Recovery Email</span>
                <form>
                    <input type="email" placeholder="Email" class="enter" required>
                    <button type="submit">Send Reset Link</button>
                    <p>Back to&nbsp;<a href="index.html">Sign in</a></p>
                </form>
            </div>
            <div id="rs">
                <img src="images/forgot.jpg" width="100%">
            </div>
        </div>
    </body>
</html>
